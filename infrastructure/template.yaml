AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HeatOps — AWS Infrastructure (API Gateway, Lambda, DynamoDB, Bedrock IAM)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        ENVIRONMENT: production
        LLM_PROVIDER: bedrock
        DATABASE_PROVIDER: dynamodb
        SCHEDULER_PROVIDER: eventbridge
        NOTIFICATION_PROVIDER: sns
        AWS_REGION: !Ref AWS::Region

Resources:
  # ===================================================================
  # API GATEWAY & LAMBDA
  # ===================================================================
  HeatOpsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend.api.lambda_handler.handler
      Description: HeatOps Command Centre API & Agent Lambda Handler
      Policies:
        - AmazonDynamoDBFullAccess
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        ApiGatewayProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY

  # ===================================================================
  # DYNAMODB TABLES
  # ===================================================================
  HeatOpsWardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: heatops_wards
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ward_id
          AttributeType: S
      KeySchema:
        - AttributeName: ward_id
          KeyType: HASH

  HeatOpsVulnerabilitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: heatops_vulnerabilities
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ward_id
          AttributeType: S
      KeySchema:
        - AttributeName: ward_id
          KeyType: HASH

  HeatOpsResourcesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: heatops_resources
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: resource_id
          AttributeType: S
        - AttributeName: ward_id
          AttributeType: S
      KeySchema:
        - AttributeName: resource_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: WardIndex
          KeySchema:
            - AttributeName: ward_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  HeatOpsEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: heatops_events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH

  HeatOpsActionPlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: heatops_action_plans
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: plan_id
          AttributeType: S
      KeySchema:
        - AttributeName: plan_id
          KeyType: HASH

  HeatOpsTasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: heatops_tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: task_id
          AttributeType: S
      KeySchema:
        - AttributeName: task_id
          KeyType: HASH

  HeatOpsEscalationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: heatops_escalations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: escalation_id
          AttributeType: S
      KeySchema:
        - AttributeName: escalation_id
          KeyType: HASH

Outputs:
  HeatOpsApiEndpoint:
    Description: API Gateway endpoint URL for HeatOps Production Backend
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
